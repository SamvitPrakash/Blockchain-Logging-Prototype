services:
  gnb:
    image: docker_ueransim
    container_name: ${GNB_CONTAINER}
    stdin_open: true
    tty: true
    volumes:
      - ${GNB_CONFIG_DIR}:/mnt/ueransim
      - ./docker_open5gs/ueransim/ueransim-gnb_init.sh:/mnt/ueransim/ueransim-gnb_init.sh:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ${ENV_FILE}
    environment:
      - COMPONENT_NAME=ueransim-gnb
    expose:
      - "38412/sctp"
      - "2152/udp"
      - "4997/udp"
    cap_add:
      - NET_ADMIN
    privileged: true
    networks:
      default:
        ipv4_address: ${GNB_IP}

networks:
  default:
    external: true
    name: docker_open5gs_default