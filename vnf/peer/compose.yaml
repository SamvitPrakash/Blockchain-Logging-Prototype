services:
  peer0:
    container_name: peer0

    image: hyperledger/fabric-peer:2.5

    environment:
      CORE_PEER_ID: peer0
      CORE_PEER_ADDRESS: peer0:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051

      CORE_PEER_CHAINCODEADDRESS: peer0:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052

      CORE_PEER_GOSSIP_BOOTSTRAP: peer0:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0:7051

      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp

      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/signcerts/cert.pem
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/keystore/8984c2444dd7b2dd7c7422f14418108e4d27e3f5455358fb33f59ae5df529c46_sk
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/tlscacerts/tls-fabric-ca-7054.pem

      FABRIC_CFG_PATH: /etc/hyperledger/fabric

    volumes:
      - /home/_c3rberus/GitHub/Blockchain-Logging-Prototype/vnf-manager/identities/peer0/msp:/etc/hyperledger/fabric/msp
      - /home/_c3rberus/GitHub/Blockchain-Logging-Prototype/vnf-manager/identities/peer0/tls:/etc/hyperledger/fabric/tls

    networks:
      - XIT

    ports:
      - "7051:7051"
      - "7052:7052"

networks:
  XIT:
    external: true